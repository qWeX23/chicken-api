spring.application.name=chicken-api
spring.profiles.active=local

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=PT31M
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=chicken-scheduler-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=PT30M30S

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.metrics.tags.application=${spring.application.name}

google.sheets.db.spreadsheetId=1fZBTykjv03MY8p0U8pbIsItKqOeJuNHm_zCWDUj_DiA
google.sheets.breeds.range=breeds!A1:G

spring.cache.type=jcache
spring.cache.cache-names=buckets

bucket4j.cache-to-use=jcache
spring.cache.caffeine.spec=maximumSize=1000000,expireAfterAccess=3600s

bucket4j.enabled=true
bucket4j.filters[0].cache-name=buckets
bucket4j.filters[0].url=.*
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=1000
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

# Do not expose internal error details in API responses
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Shared Ollama runtime defaults
koog.ollama.base-url=${KOOG_OLLAMA_BASE_URL:${KOOG_AGENT_BASE_URL:https://ollama.com}}
koog.ollama.web-tools-base-url=${KOOG_OLLAMA_WEB_TOOLS_BASE_URL:https://ollama.com}
koog.ollama.web-tools-provider=${KOOG_OLLAMA_WEB_TOOLS_PROVIDER:ollama}
koog.ollama.api-key=${KOOG_OLLAMA_API_KEY:${KOOG_AGENT_API_KEY:${OLLAMA_API_KEY:}}}
koog.ollama.api-key-file=${KOOG_OLLAMA_API_KEY_FILE:}
koog.ollama.api-key-required=${KOOG_OLLAMA_API_KEY_REQUIRED:true}
koog.ollama.web-tools-api-key=${KOOG_OLLAMA_WEB_TOOLS_API_KEY:}
koog.ollama.web-tools-api-key-file=${KOOG_OLLAMA_WEB_TOOLS_API_KEY_FILE:}
koog.ollama.embedding-base-url=${KOOG_OLLAMA_EMBEDDING_BASE_URL:${koog.ollama.base-url}}
koog.ollama.embedding-api-key=${KOOG_OLLAMA_EMBEDDING_API_KEY:}
koog.ollama.embedding-api-key-file=${KOOG_OLLAMA_EMBEDDING_API_KEY_FILE:}
koog.ollama.embedding-model=nomic-embed-text
koog.ollama.readiness-request-timeout=${KOOG_OLLAMA_READINESS_REQUEST_TIMEOUT:PT2M}

# Koog chicken facts agent defaults
koog.agent.enabled=true
koog.agent.model=gpt-oss:120b
koog.agent.context-length=8192
koog.agent.prompt=Find one surprising chicken fact supported by a web search result, then call save_chicken_fact with the fact and its exact source URL.
koog.agent.web-search-max-results=3
koog.agent.max-agent-iterations=256
koog.agent.retry-search-budget-per-duplicate=3
koog.agent.excluded-search-domains=wikipedia.org
koog.agent.preferred-search-domains=
koog.agent.fact-dedup-threshold=0.88
koog.agent.topic-cluster-threshold=0.78
koog.agent.max-covered-topics=15
koog.agent.source-domain-max-repeats=3
koog.agent.scheduler.enabled=true
koog.agent.scheduler.cron=0 15 4 * * *
koog.agent.scheduler.zone=America/Chicago
koog.agent.scheduler.timeout=PT30M

# Koog breed research agent defaults
koog.breed-research-agent.enabled=true
koog.breed-research-agent.model=${koog.agent.model}
koog.breed-research-agent.context-length=8192
koog.breed-research-agent.web-search-max-results=3
koog.breed-research-agent.max-agent-iterations=128
koog.breed-research-agent.max-tool-calls=8
koog.breed-research-agent.scheduler.enabled=true
koog.breed-research-agent.scheduler.cron=0 15 5 * * *
koog.breed-research-agent.scheduler.zone=America/Chicago
koog.breed-research-agent.scheduler.timeout=PT30M

# Phoenix tracing (OTLP HTTP exporter) for Koog agents
koog.tracing.phoenix.enabled=false
koog.tracing.phoenix.endpoint=${PHOENIX_COLLECTOR_ENDPOINT:http://localhost:6006/v1/traces}
koog.tracing.phoenix.project-name=${PHOENIX_PROJECT_NAME:chicken-api}
koog.tracing.phoenix.service-name=chicken-api-agents
koog.tracing.phoenix.service-version=0.0.1
koog.tracing.phoenix.deployment-environment=${SPRING_PROFILES_ACTIVE:local}
koog.tracing.phoenix.verbose=${KOOG_TRACING_PHOENIX_VERBOSE:false}
